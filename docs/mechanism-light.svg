<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-label="Typing a row and clicking save both reach the same rule module, so the two paths cannot diverge">
  <defs>
    <style>
      .n { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .s { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .lbl  { fill: #5C6470; font-size: 10px; letter-spacing: 2px; }
      .name { fill: #16181D; font-size: 13px; }
      .note { fill: #5C6470; font-size: 12px; }
      .unit { fill: #8A5A2B; font-size: 10.5px; letter-spacing: 1.4px; }
      .box  { fill: none; stroke: #D5D9DE; stroke-width: 1; }
      .core { fill: none; stroke: #8A5A2B; stroke-width: 1.5; }
      .arr  { stroke: #B9BFC7; stroke-width: 1; fill: none; }
      .head { fill: #B9BFC7; }
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" class="head"/>
    </marker>
  </defs>

  <rect x="0.5" y="26.5" width="209" height="52" rx="3" class="box"/>
  <text x="16" y="48" class="n unit">WHILE TYPING</text>
  <text x="16" y="66" class="n name">check-rate route</text>

  <rect x="0.5" y="140.5" width="209" height="52" rx="3" class="box"/>
  <text x="16" y="162" class="n unit">ON SAVE</text>
  <text x="16" y="180" class="n name">form clean()</text>

  <path d="M210,52 L280,52 L280,100 L326,100" class="arr" marker-end="url(#a)"/>
  <path d="M210,166 L280,166 L280,118 L326,118" class="arr" marker-end="url(#a)"/>

  <rect x="330.5" y="74.5" width="228" height="70" rx="3" class="core"/>
  <text x="348" y="98" class="n unit">ONE SOURCE OF TRUTH</text>
  <text x="348" y="118" class="n name">rates/rules.py</text>
  <text x="348" y="134" class="s note">floor, discount cap, minimum stay</text>

  <path d="M559,109 L655,109" class="arr" marker-end="url(#a)"/>

  <rect x="659.5" y="74.5" width="218" height="70" rx="3" class="box"/>
  <text x="676" y="98" class="n unit">SAME VERDICT</text>
  <text x="676" y="118" class="s note">Character for character,</text>
  <text x="676" y="134" class="s note">asserted by a test.</text>

  <text x="0" y="16" class="n lbl">TWO PATHS, ONE RULE</text>
  <text x="0" y="224" class="s note">No rule is written in JavaScript. The browser only shows what the server already decided.</text>
</svg>
